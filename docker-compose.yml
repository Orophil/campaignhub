# One-command local stack: PostgreSQL + API (with migrations & seed) + web.
#   docker compose up --build
# Web: http://localhost:3000   API: http://localhost:4000/api   Swagger: http://localhost:4000/api/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campaignhub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d campaignhub']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/campaignhub
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-9f3c1a}
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  # Runs once: applies migrations and loads the demo data. Safe to re-run (it wipes & re-seeds).
  seed:
    build: ./backend
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/database/seed.js']
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/campaignhub
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
